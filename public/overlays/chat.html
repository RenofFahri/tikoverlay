<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:transparent;overflow:hidden;height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
/* THEMES */
body.dark .chat-item{background:rgba(13,14,20,.85);border-color:rgba(255,255,255,.08);color:#fff}
body.dark .chat-username{color:#25f4ee}
body.light .chat-item{background:rgba(255,255,255,.92);border-color:rgba(0,0,0,.08);color:#111}
body.light .chat-username{color:#fe2c55}
body.neon .chat-item{background:rgba(0,15,8,.85);border:1px solid #00ff88;color:#00ff88}
body.neon .chat-username{color:#fff;text-shadow:0 0 8px #00ff88}
body.glass .chat-item{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);color:#fff}
body.glass .chat-username{color:#25f4ee}
body.minimal .chat-item{background:rgba(0,0,0,.7);border-left:3px solid #fff;border-radius:4px;color:#fff}
body.minimal .chat-username{color:#25f4ee}
body.pink .chat-item{background:rgba(60,0,35,.85);border-color:rgba(255,100,150,.2);color:#ffcce0}
body.pink .chat-username{color:#ff6496}

.chat-list{display:flex;flex-direction:column;gap:6px;max-height:100vh;overflow:hidden}
.chat-item{display:flex;align-items:flex-start;gap:9px;padding:9px 13px;border-radius:10px;border:1px solid transparent;animation:slideUp .25s ease;word-break:break-word;backdrop-filter:blur(8px)}
.chat-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover;border:2px solid rgba(255,255,255,.2)}
.chat-avatar-fallback{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);font-size:13px;font-weight:700;flex-shrink:0}
.chat-body{flex:1}
.chat-header{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.chat-username{font-weight:700;font-size:13px}
.chat-verified{font-size:11px;color:#25f4ee}
.chat-badge{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700}
.badge-mod{background:rgba(34,197,94,.3);color:#22c55e}
.badge-sub{background:rgba(168,85,247,.3);color:#c084fc}
.badge-gifter{background:rgba(255,215,0,.3);color:#ffd700}
.chat-msg{font-size:14px;line-height:1.4}
.event-join{border-left:4px solid #00ff88!important; background: rgba(0, 0, 0, 0.4)!important;}
.event-follow{border-left:4px solid #fe2c55!important; background: rgba(0, 0, 0, 0.4)!important;}
body.light .event-join, body.light .event-follow { background: rgba(255, 255, 255, 0.6)!important; }
body.neon .event-join { border-color: #00ff88!important; }
body.pink .event-join { border-color: #ff6496!important; }

.event-icon{margin-right:5px}

@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-out{animation:fadeOut .4s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(-8px)}}
</style>
</head>
<body class="dark" id="overlayBody">
<div class="chat-list" id="chatList"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  extraHeaders: {
    'ngrok-skip-browser-warning': 'true'
  }
});

let MAX    = 30;
let queue  = [];
let isProcessing = false;
let cfg    = {
  theme:'dark', fontSize:14, animation:'slideUp', position:'bottom',
  showChat:true, showJoin:true, showFollow:true, showAvatar:true, showBadge:true
};

socket.on('connect', () => console.log('✅ Overlay Connected'));
socket.on('init', d => {
  if(d.settings) applySettings(d.settings);
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  (d.chatLog||[]).slice(-MAX).forEach(e => addItem(e, true)); // true = instant for old logs
});
socket.on('settings', s => applySettings(s));
socket.on('chatEvent', data => {
  // Debug log (bisa dihapus nanti)
  console.log('Incoming event:', data.type, 'Show join?', cfg.chatShow?.join);

  // VALIDASI FILTER: Jika join dimatikan, jangan masukkan ke antrian
  if (data.type === 'member' || data.type === 'join') {
     if (cfg.chatShow && cfg.chatShow.join === false) return;
  }
  
  if (data.type === 'follow' && cfg.chatShow?.follow === false) return;
  if (data.type === 'chat' && cfg.chatShow?.chat === false) return;
  
  queue.push(data);
  processQueue();
});

function applySettings(s){
  if(s.overlayTheme)  { cfg.theme = s.overlayTheme;  document.getElementById('overlayBody').className = s.overlayTheme; }
  if(s.chatShow)      { cfg.chatShow = s.chatShow; }
  if(s.chatMax)       { MAX = parseInt(s.chatMax) || 30; }
  if(s.chatFontSize)  { cfg.fontSize = s.chatFontSize; document.documentElement.style.setProperty('--chat-fs', s.chatFontSize+'px'); }
  if(s.chatPosition)  { 
    document.getElementById('chatList').style.flexDirection = 'column';
  }
}

function processQueue() {
  if (isProcessing || queue.length === 0) return;
  isProcessing = true;
  
  const ev = queue.shift();
  addItem(ev);
  
  // Jika antrian banyak, percepat jedanya. Jika sedikit, santai saja (500ms).
  const delay = queue.length > 5 ? 100 : 500;
  setTimeout(() => {
    isProcessing = false;
    processQueue();
  }, delay);
}

function addItem(ev, instant = false){
  if(ev.type === 'chat' && !cfg.showChat) return;
  const list = document.getElementById('chatList');
  const el = document.createElement('div');
  el.className = 'chat-item' + (ev.type==='join'?' event-join':ev.type==='follow'?' event-follow':ev.type==='share'?' event-share':'');
  
  const user = ev.nickname || ev.user || '?';
  const avatar = cfg.showAvatar ? (ev.avatar ? `<img class="chat-avatar" src="${ev.avatar}" onerror="this.style.display='none'">` : `<div class="chat-avatar-fallback">${user[0]}</div>`) : '';
  
  let body = '';
  if(ev.type==='chat') body = `<div class="chat-header"><span class="chat-username">${esc(user)}</span></div><div class="chat-msg">${esc(ev.msg)}</div>`;
  else if(ev.type==='join') body = `<div class="chat-msg">👋 ${esc(user)} bergabung</div>`;
  else if(ev.type==='follow') body = `<div class="chat-msg">❤️ ${esc(user)} follow</div>`;
  else if(ev.type==='share') body = `<div class="chat-msg">🔗 ${esc(user)} share</div>`;

  el.innerHTML = avatar + `<div class="chat-body">${body}</div>`;
  
  // Masukkan di akhir (Bottom)
  list.appendChild(el);

  if(!instant) {
    el.style.animation = 'slideUp 0.3s ease forwards';
  }

  // Limit items - hapus yang paling lama (First Child)
  while(list.children.length > MAX) {
    list.removeChild(list.firstChild);
  }
}

function getAnim(type){
  const anims = { slideUp:'slideUp .25s ease', fadeIn:'fadeIn .3s ease', popIn:'popIn .3s cubic-bezier(.34,1.56,.64,1)', slideLeft:'slideLeft .25s ease' };
  return anims[type] || anims.slideUp;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>

</body>
</html>
