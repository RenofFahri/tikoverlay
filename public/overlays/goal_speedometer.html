<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gift Goal Speedometer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:transparent;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.speedometer-container {
  position: relative;
  width: 240px;
  height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  background: rgba(13, 14, 20, 0.8);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.gauge-wrap {
  position: relative;
  width: 180px;
  height: 90px;
  overflow: hidden;
}

.gauge-bg {
  width: 180px;
  height: 180px;
  border: 15px solid rgba(255, 255, 255, 0.08);
  border-radius: 50%;
  position: absolute;
}

.gauge-fill {
  width: 180px;
  height: 180px;
  border: 15px solid #25f4ee;
  border-radius: 50%;
  position: absolute;
  border-left-color: transparent;
  border-bottom-color: transparent;
  transform: rotate(-135deg); /* Start at 0 */
  transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 15px rgba(37, 244, 238, 0.4);
}

.gauge-center {
  position: absolute;
  bottom: 0;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.goal-val {
  font-size: 28px;
  font-weight: 800;
  color: #fff;
  line-height: 1;
}

.goal-target {
  font-size: 11px;
  color: #a0a8c0;
  text-transform: uppercase;
  margin-top: 4px;
}

.goal-label {
  font-size: 14px;
  font-weight: 700;
  color: #25f4ee;
  margin-bottom: 5px;
  text-shadow: 0 0 10px rgba(37, 244, 238, 0.5);
}

/* THEMES */
body.neon .gauge-fill { border-color: #00ff88; box-shadow: 0 0 15px #00ff88; }
body.neon .goal-label { color: #00ff88; }

body.pink .gauge-fill { border-color: #ff6496; box-shadow: 0 0 15px #ff6496; }
body.pink .goal-label { color: #ff6496; }

body.glass .speedometer-container { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.2); }
</style>
</head>
<body class="dark" id="overlayBody">

<div class="speedometer-container">
  <div class="goal-label" id="goalLabel">Gift Goal</div>
  <div class="gauge-wrap">
    <div class="gauge-bg"></div>
    <div class="gauge-fill" id="goalFill"></div>
  </div>
  <div class="gauge-center">
    <div class="goal-val" id="goalCurrent">0</div>
    <div class="goal-target" id="goalTarget">Target: 1K</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  extraHeaders: { 'ngrok-skip-browser-warning': 'true' }
});

function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'K' : n; }

socket.on('init', d => {
  if(d.settings?.overlayTheme) document.getElementById('overlayBody').className = d.settings.overlayTheme;
  if(d.giftGoal) updateGoal(d.giftGoal);
});

socket.on('settings', s => {
  if(s.overlayTheme) document.getElementById('overlayBody').className = s.overlayTheme;
});

socket.on('giftGoal', g => {
  updateGoal(g);
});

function updateGoal(g) {
  if (!g) return;
  document.getElementById('goalLabel').textContent = g.label || 'Gift Goal';
  document.getElementById('goalCurrent').textContent = fmtNum(g.current || 0);
  document.getElementById('goalTarget').textContent = 'Target: ' + fmtNum(g.target || 1000);
  
  const pct = Math.min(100, Math.round(((g.current || 0) / (g.target || 1)) * 100));
  // 0% = -135deg, 100% = 45deg
  const rotation = -135 + (pct * 1.8);
  document.getElementById('goalFill').style.transform = `rotate(${rotation}deg)`;
}
</script>
</body>
</html>
