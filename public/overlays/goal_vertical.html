<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gift Goal Vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:transparent;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.battery-container {
  width: 100px;
  height: 250px;
  background: rgba(13, 14, 20, 0.85);
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px;
  position: relative;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.battery-container::after {
  content: "";
  position: absolute;
  top: -10px;
  width: 30px;
  height: 10px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px 4px 0 0;
}

.track {
  flex: 1;
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 8px;
  display: flex;
  flex-direction: column-reverse;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.fill {
  width: 100%;
  height: 0%;
  background: linear-gradient(0deg, #fe2c55, #25f4ee);
  transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 -5px 15px rgba(37, 244, 238, 0.5);
}

.info {
  margin-top: 15px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.val {
  font-size: 20px;
  font-weight: 900;
  color: #fff;
}

.target {
  font-size: 11px;
  color: #a0a8c0;
  font-weight: 700;
}

.label {
  position: absolute;
  top: -40px;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 700;
  color: #25f4ee;
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(37, 244, 238, 0.5);
}

/* THEMES */
body.neon .fill { background: linear-gradient(0deg, #00cc6a, #00ff88); box-shadow: 0 -5px 15px #00ff88; }
body.neon .label { color: #00ff88; }

body.pink .fill { background: linear-gradient(0deg, #ff0050, #ff6496); box-shadow: 0 -5px 15px #ff6496; }
body.pink .label { color: #ff6496; }
</style>
</head>
<body class="dark" id="overlayBody">

<div class="battery-container">
  <div class="label" id="goalLabel">Gift Goal</div>
  <div class="track">
    <div class="fill" id="goalFill"></div>
  </div>
  <div class="info">
    <div class="val" id="goalCurrent">0</div>
    <div class="target" id="goalTarget">Target: 1K</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  extraHeaders: { 'ngrok-skip-browser-warning': 'true' }
});

function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'K' : n; }

socket.on('init', d => {
  if(d.settings?.overlayTheme) document.getElementById('overlayBody').className = d.settings.overlayTheme;
  if(d.giftGoal) updateGoal(d.giftGoal);
});

socket.on('settings', s => {
  if(s.overlayTheme) document.getElementById('overlayBody').className = s.overlayTheme;
});

socket.on('giftGoal', g => {
  updateGoal(g);
});

function updateGoal(g) {
  if (!g) return;
  document.getElementById('goalLabel').textContent = g.label || 'Gift Goal';
  document.getElementById('goalCurrent').textContent = fmtNum(g.current || 0);
  document.getElementById('goalTarget').textContent = 'Target: ' + fmtNum(g.target || 1000);
  
  const pct = Math.min(100, Math.round(((g.current || 0) / (g.target || 1)) * 100));
  document.getElementById('goalFill').style.height = pct + '%';
}
</script>
</body>
</html>
